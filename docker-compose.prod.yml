services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      API_AUTH_MODE: strict
      API_WRITE_TOKEN: ${API_WRITE_TOKEN:?Set API_WRITE_TOKEN in .env before starting production}
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
      API_OPERATOR_TOKEN: ${API_OPERATOR_TOKEN:-}
      API_RESEARCHER_TOKEN: ${API_RESEARCHER_TOKEN:-}
      API_VIEWER_TOKEN: ${API_VIEWER_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AGENT_RUNTIME_SECRET_KEY: ${AGENT_RUNTIME_SECRET_KEY:-}
      AGENT_RUNTIME_SECRET_KEY_PREVIOUS: ${AGENT_RUNTIME_SECRET_KEY_PREVIOUS:-}
      AGENT_RUNTIME_SECRET_VAULT_FILE: ${AGENT_RUNTIME_SECRET_VAULT_FILE:-}
      AGENT_RUNTIME_SECRET_KEY_FILE: ${AGENT_RUNTIME_SECRET_KEY_FILE:-}
      OPS_LOG_RETENTION_DAYS: ${OPS_LOG_RETENTION_DAYS:-30}
      OPS_LOG_MAX_EVENTS: ${OPS_LOG_MAX_EVENTS:-1000}
      OPS_LOG_ARCHIVE_DIR: ${OPS_LOG_ARCHIVE_DIR:-}
      KNOWLEDGE_HOT_MAX_ITEMS: ${KNOWLEDGE_HOT_MAX_ITEMS:-1000}
      KNOWLEDGE_ARCHIVE_DIR: ${KNOWLEDGE_ARCHIVE_DIR:-}
      BACKTEST_PARAMETER_SCAN_HOT_MAX_JOBS: ${BACKTEST_PARAMETER_SCAN_HOT_MAX_JOBS:-1000}
      BACKTEST_PARAMETER_SCAN_ARCHIVE_DIR: ${BACKTEST_PARAMETER_SCAN_ARCHIVE_DIR:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL_ALLOWLIST: ${LLM_BASE_URL_ALLOWLIST:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_BASE_URL_ALLOWLIST: ${MARKET_DATA_BASE_URL_ALLOWLIST:-}
      TIANYUAN_QUANT_DB_URL: sqlite+aiosqlite:////app/storage/tianyuan_quant.db
      SEED_MOCK_HISTORY: "0"
      TIANYUAN_FORCE_MOCK_MARKET_DATA: ${TIANYUAN_FORCE_MOCK_MARKET_DATA:-0}
    volumes:
      - ./deploy/db:/app/storage
      - ./deploy/backend-storage:/app/backend/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
